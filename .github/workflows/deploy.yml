name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changed.outputs.urls }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # the live address; Settings > Pages > Custom domain must match
          SITE_URL: https://nivedkrishnathavarayil.com
      # which pages differ from the live site, so IndexNow only hears about real changes
      - id: changed
        run: echo "urls=$(node tools/indexnow/changed.mjs)" >> "$GITHUB_OUTPUT"
        env:
          SITE_URL: https://nivedkrishnathavarayil.com
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # tell Bing and the other IndexNow engines about the pages that changed
  indexnow:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # give the CDN a moment to serve the new pages before engines crawl them
      - run: sleep 45
      - run: node tools/indexnow/ping.mjs
        env:
          SITE_URL: https://nivedkrishnathavarayil.com
          CHANGED: ${{ needs.build.outputs.changed }}
